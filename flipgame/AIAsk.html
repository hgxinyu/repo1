<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI玩放置 · ShinE</title>
  <script>
    (function () {
      var host = (window.location.hostname || '').toLowerCase();
      var isLocal = host === '' || host === 'localhost' || host === '0.0.0.0' || host === '127.0.0.1' || host === '::1' || /^10\./.test(host) || /^192\.168\./.test(host) || /^172\.(1[6-9]|2\d|3[01])\./.test(host);
      var isStage = host === 'stage' || host.startsWith('stage.') || host.startsWith('stage-') || host.startsWith('stage--') || host.indexOf('--stage') !== -1 || host.indexOf('-stage.') !== -1;
      var svg = isLocal ? 'assets/local-logo.svg' : (isStage ? 'assets/stage-logo.svg' : 'assets/shine-logo.svg');
      var png32 = isLocal ? 'assets/local-logo-32.png' : (isStage ? 'assets/stage-logo-32.png' : 'assets/shine-logo-32.png');
      var ico = isLocal ? 'assets/local-favicon.ico' : (isStage ? 'assets/stage-favicon.ico' : 'assets/favicon.ico');
      var apple = isLocal ? 'assets/local-logo-180.png' : (isStage ? 'assets/stage-logo-180.png' : 'assets/shine-logo-180.png');
      var manifest = isLocal ? 'site.local.webmanifest' : (isStage ? 'site.stage.webmanifest' : 'site.webmanifest');
      var theme = isLocal ? '#fb7185' : (isStage ? '#0891b2' : '#1f2937');
      document.write('<link rel="icon" type="image/svg+xml" href="' + svg + '">');
      document.write('<link rel="icon" type="image/png" sizes="32x32" href="' + png32 + '">');
      document.write('<link rel="shortcut icon" href="' + ico + '">');
      document.write('<link rel="apple-touch-icon" sizes="180x180" href="' + apple + '">');
      document.write('<link rel="manifest" href="' + manifest + '">');
      document.write('<meta name="theme-color" content="' + theme + '">');
    })();
  </script>
  <style>
    :root {
      --bg: #f7faf8;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --brand: #0f766e;
      --brand-strong: #0b5f59;
      --radius: 14px;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.07);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    nav#topbar-nav {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 80;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      backdrop-filter: saturate(140%) blur(8px);
    }
    nav#topbar-nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      color: var(--brand-strong);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    nav#topbar-nav a:hover { background: #eef7f4; }

    .wrap {
      width: min(920px, 100%);
      padding: 70px clamp(14px, 4vw, 32px) 34px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .site-header { padding: 0 2px; }
    .title h1 {
      margin: 0;
      font-size: clamp(24px, 4.6vw, 32px);
      line-height: 1.2;
      letter-spacing: -0.01em;
      font-weight: 800;
    }
    .title p {
      margin: 6px 0 0;
      color: var(--muted);
      max-width: 640px;
      font-size: 13.5px;
      line-height: 1.65;
    }

    .workspace { display: flex; flex-direction: column; gap: 14px; }

    .chat-surface {
      display: grid;
      grid-template-rows: 1fr auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      height: clamp(420px, 62vh, 660px);
    }
    .messages {
      min-height: 0;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fbfcfc;
    }
    .message {
      max-width: min(680px, 86%);
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message.user {
      align-self: flex-end;
      background: #e0f2ee;
      color: #134e4a;
      border-bottom-right-radius: 4px;
    }
    .message.assistant {
      align-self: flex-start;
      background: #fff;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .message.system {
      align-self: center;
      max-width: 94%;
      background: transparent;
      border: 1px dashed #cbdad5;
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
    }
    .message-meta {
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid rgba(15, 118, 110, 0.12);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      background: #fff;
      display: grid;
      gap: 9px;
    }
    .composer textarea {
      width: 100%;
      min-height: 62px;
      max-height: 200px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      background: #f8faf9;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }
    .composer textarea:focus-visible {
      border-color: rgba(15, 118, 110, 0.45);
      background: #fff;
      outline: 3px solid rgba(15, 118, 110, 0.12);
      outline-offset: 0;
    }
    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .composer-actions > div:last-child { display: flex; gap: 8px; }
    .status {
      min-height: 18px;
      min-width: 0;
      flex: 1 1 auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .clear-btn,
    .send-btn {
      flex-shrink: 0;
      white-space: nowrap;
      border-radius: 10px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .clear-btn {
      border: 1px solid var(--border);
      padding: 8px 14px;
      background: #fff;
      color: var(--muted);
    }
    .clear-btn:hover { color: var(--ink); border-color: #cbd5e1; }
    .send-btn {
      border: 0;
      padding: 9px 22px;
      background: var(--brand);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(15, 118, 110, 0.18);
    }
    .send-btn:hover:not(:disabled) { background: var(--brand-strong); }
    .send-btn:disabled { opacity: 0.6; cursor: wait; }
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(15, 118, 110, 0.28);
      outline-offset: 2px;
    }

    .source-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 0 4px;
    }
    .source-panel h2 { margin: 0; font-size: 11.5px; font-weight: 500; color: var(--muted); }
    .source-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .source-chip {
      border: 1px solid rgba(15, 118, 110, 0.14);
      border-radius: 999px;
      padding: 4px 9px;
      background: #eef7f4;
      color: #35635d;
      font-size: 11px;
    }

    @media (max-width: 700px) {
      .wrap { padding: 58px 12px 22px; gap: 12px; }
      .title h1 { font-size: 23px; }
      .title p { font-size: 12.5px; }
      .chat-surface { height: calc(100dvh - 252px); min-height: 360px; border-radius: 12px; }
      .messages { padding: 14px; gap: 10px; }
      .message { max-width: 93%; font-size: 13.5px; padding: 10px 12px; }
      .composer { padding: 10px; }
      .composer textarea { font-size: 16px; min-height: 54px; }
      .status { font-size: 11px; }
      .source-panel { padding: 0; gap: 8px; }
    }
  </style>
  <link rel="stylesheet" href="assets/home-nav.css">
  <script src="assets/home-navigation.js" defer></script>
</head>
<body>
  <nav id="topbar-nav" aria-label="页面导航">
    <a href="index.html" id="homeLink">返回首页</a>
  </nav>

  <div class="wrap">
    <header class="site-header">
      <div class="title">
        <h1 id="pageTitle">AI玩放置</h1>
        <p id="pageDesc">基于工具规则和 IHassistant 知识库的问答。</p>
      </div>
    </header>

    <main class="workspace">
      <section class="chat-surface" aria-label="AI 问答">
        <div class="messages" id="messages" aria-live="polite"></div>
        <form class="composer" id="chatForm">
          <textarea id="questionInput" maxlength="1200" required></textarea>
          <div class="composer-actions">
            <div class="status" id="status" role="status"></div>
            <div>
              <button class="clear-btn" id="clearBtn" type="button">清空</button>
              <button class="send-btn" id="sendBtn" type="submit">发送</button>
            </div>
          </div>
        </form>
      </section>

      <section class="source-panel">
        <h2 id="sourceTitle">当前资料范围</h2>
        <div class="source-list" id="sourceList"></div>
      </section>
    </main>
  </div>

  <script type="module">
    import { authFetch, isStaticMockPreview } from "./assets/auth-session.js";
    import { guardVipPage } from "./assets/vip-guard.js";

    const I18N = {
      zh: {
        title: 'AI玩放置 · ShinE',
        page_title: 'AI玩放置',
        page_desc: '基于工具规则和 IHassistant 知识库的问答。',
        home: '返回首页',
        nav_label: '页面导航',
        chat_label: 'AI玩放置',
        source_title: '当前资料范围',
        send: '发送',
        clear: '清空',
        placeholder: '输入你的问题，例如：DTV 的三种充能分别怎么触发？',
        empty: '请输入问题。',
        sending: 'AI 正在回答...',
        ready: '已连接。',
        local: '本地静态预览不能调用 Netlify Function；部署后或用 Netlify 本地环境测试提问。',
        fail_prefix: '请求失败：',
        welcome: '可以问凝魂、远征积分、觉醒模拟器规则，也可以问 IHassistant 知识库已有的英雄、神器、魔兽、Boss 和机制资料。资料库目前还很有限，会慢慢完善；资料不足时我会标记待确认。',
        page_name: 'AI玩放置',
        model_label: '模型：',
        source_label: '来源：',
        sources: ['游戏相关 Markdown 文档', '工具规则文档', 'IHassistant/knowledge']
      },
      en: {
        title: 'Play IH with AI · ShinE',
        page_title: 'Play IH with AI',
        page_desc: 'Q&A over tool rules and the IHassistant knowledge base.',
        home: 'Home',
        nav_label: 'Page navigation',
        chat_label: 'Play IH with AI',
        source_title: 'Current Sources',
        send: 'Send',
        clear: 'Clear',
        placeholder: 'Ask a question, e.g. how do DTV charges trigger?',
        empty: 'Please enter a question.',
        sending: 'AI is answering...',
        ready: 'Connected.',
        local: 'Static local preview cannot call Netlify Functions. Ask questions after deploy or in a Netlify local environment.',
        fail_prefix: 'Request failed: ',
        welcome: 'Ask about tool rules or existing IHassistant knowledge such as heroes, artifacts, monsters, bosses, and mechanics. The knowledge base is still limited and growing; missing evidence will be marked pending confirmation.',
        page_name: 'Play IH with AI',
        model_label: 'Model: ',
        source_label: 'Sources: ',
        sources: ['Game-related Markdown docs', 'Tool rule docs', 'IHassistant/knowledge']
      }
    };

    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('chatForm');
    const input = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const homeLink = document.getElementById('homeLink');
    const pageTitle = document.getElementById('pageTitle');
    const pageDesc = document.getElementById('pageDesc');
    const sourceTitle = document.getElementById('sourceTitle');
    const sourceList = document.getElementById('sourceList');
    const isLocal = isStaticMockPreview();
    const MAX_CONTEXT_TURNS = 10;
    let history = [];
    let currentLang = (localStorage.getItem('flipgame_lang') || '').toLowerCase();

    if (currentLang !== 'zh' && currentLang !== 'en') {
      currentLang = (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
    }

    function t(key) {
      return (I18N[currentLang] && I18N[currentLang][key]) || I18N.zh[key] || '';
    }

    function addMessage(role, content, meta = '') {
      const el = document.createElement('div');
      el.className = `message ${role}`;
      const body = document.createElement('div');
      body.textContent = content;
      el.appendChild(body);
      if (meta) {
        const metaEl = document.createElement('div');
        metaEl.className = 'message-meta';
        metaEl.textContent = meta;
        el.appendChild(metaEl);
      }
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function answerMeta(data) {
      const parts = [];
      if (data.model) {
        parts.push(`${t('model_label')}${data.model}`);
      }
      const paths = Array.isArray(data.sources)
        ? [...new Set(data.sources.map((source) => source && source.path).filter(Boolean))]
        : [];
      if (paths.length) {
        parts.push(`${t('source_label')}${paths.join(' ; ')}`);
      }
      return parts.join('\n');
    }

    function trimHistory() {
      history = history.slice(-(MAX_CONTEXT_TURNS * 2));
    }

    function renderSources() {
      sourceList.replaceChildren();
      t('sources').forEach((label) => {
        const chip = document.createElement('span');
        chip.className = 'source-chip';
        chip.textContent = label;
        sourceList.appendChild(chip);
      });
    }

    function setStaticText() {
      document.title = t('title');
      document.documentElement.lang = currentLang === 'zh' ? 'zh-Hans' : 'en';
      const badge = pageTitle.querySelector('.vip-page-badge');
      pageTitle.textContent = t('page_title');
      if (badge) pageTitle.appendChild(badge);
      pageDesc.textContent = t('page_desc');
      homeLink.textContent = t('home');
      document.getElementById('topbar-nav').setAttribute('aria-label', t('nav_label'));
      document.querySelector('.chat-surface').setAttribute('aria-label', t('chat_label'));
      sourceTitle.textContent = t('source_title');
      sendBtn.textContent = t('send');
      clearBtn.textContent = t('clear');
      input.setAttribute('placeholder', t('placeholder'));
      renderSources();
      statusEl.textContent = isLocal ? t('local') : t('ready');
    }

    async function ask(question) {
      const response = await authFetch('/api/ai-chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ question, history: history.slice(-(MAX_CONTEXT_TURNS * 2)) })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || `${response.status} ${response.statusText}`);
      }
      return {
        answer: data.answer || '',
        model: data.model || '',
        sources: Array.isArray(data.sources) ? data.sources : []
      };
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) {
        statusEl.textContent = t('empty');
        input.focus();
        return;
      }

      addMessage('user', question);
      history.push({ role: 'user', content: question });
      trimHistory();
      input.value = '';
      sendBtn.disabled = true;
      statusEl.textContent = t('sending');

      try {
        const result = await ask(question);
        const answer = result.answer;
        addMessage('assistant', answer, answerMeta(result));
        history.push({ role: 'assistant', content: answer });
        trimHistory();
        statusEl.textContent = t('ready');
      } catch (error) {
        const message = `${t('fail_prefix')}${error.message || error}`;
        addMessage('system', message);
        statusEl.textContent = message;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    clearBtn.addEventListener('click', () => {
      history = [];
      messagesEl.replaceChildren();
      addMessage('system', t('welcome'));
      statusEl.textContent = isLocal ? t('local') : t('ready');
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        if (!sendBtn.disabled) form.requestSubmit();
      }
    });

    await guardVipPage({
      pageName: t('page_name'),
      next: 'AIAsk.html',
      access: 'vip'
    });
    setStaticText();
    addMessage('system', t('welcome'));
  </script>
</body>
</html>
