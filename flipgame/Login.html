<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · ShinE</title>
  <script>
    (function () {
      var host = (window.location.hostname || '').toLowerCase();
      var isLocal = host === '' || host === 'localhost' || host === '0.0.0.0' || host === '127.0.0.1' || host === '::1' || /^10\./.test(host) || /^192\.168\./.test(host) || /^172\.(1[6-9]|2\d|3[01])\./.test(host);
      var isStage = host === 'stage' || host.startsWith('stage.') || host.startsWith('stage-') || host.startsWith('stage--') || host.indexOf('--stage') !== -1 || host.indexOf('-stage.') !== -1;
      var svg = isLocal ? 'assets/local-logo.svg' : (isStage ? 'assets/stage-logo.svg' : 'assets/shine-logo.svg');
      var png32 = isLocal ? 'assets/local-logo-32.png' : (isStage ? 'assets/stage-logo-32.png' : 'assets/shine-logo-32.png');
      var ico = isLocal ? 'assets/local-favicon.ico' : (isStage ? 'assets/stage-favicon.ico' : 'assets/favicon.ico');
      document.write('<link rel="icon" type="image/svg+xml" href="' + svg + '">');
      document.write('<link rel="icon" type="image/png" sizes="32x32" href="' + png32 + '">');
      document.write('<link rel="shortcut icon" href="' + ico + '">');
    })();
  </script>
  <style>
    :root { --border: #e5e7eb; --ink: #111827; --muted: #64748b; --brand: #0f766e; --bg: #f7faf8; --shadow: 0 14px 32px rgba(15, 23, 42, .12); }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif; line-height: 1.6; }
    body { display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: min(480px, 100%); background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: clamp(22px, 5vw, 32px); }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
    .actions { display: grid; gap: 12px; margin-top: 22px; }
    a.button { display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid rgba(15, 118, 110, .34); border-radius: 14px; padding: 12px 16px; background: #fff; color: var(--brand); font-size: 15px; font-weight: 700; text-decoration: none; cursor: pointer; }
    a.button.primary { border-color: transparent; background: linear-gradient(135deg, #0f766e, #c2410c); color: #fff; }
    a.button:hover { transform: translateY(-1px); }
    .status { min-height: 22px; color: var(--muted); font-size: 14px; margin-top: 16px; }
    .toplink { display: inline-block; margin-bottom: 18px; color: var(--brand); text-decoration: none; font-size: 14px; }
    .footnote { margin-top: 20px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <a class="toplink" id="homeLink" href="index.html">回到主页</a>
    <h1 id="pageTitle">登录</h1>
    <p id="pageDesc">使用 Google 或邮箱验证码登录。首次使用时，Logto 会在同一流程中完成账号创建。</p>
    <div class="actions" aria-label="登录方式">
      <a class="button primary" id="googleLogin" data-auth-entry="/api/auth/sign-in?connector=google" href="/api/auth/sign-in?connector=google">使用 Google 登录</a>
      <a class="button" id="emailLogin" data-auth-entry="/api/auth/sign-in?connector=email" href="/api/auth/sign-in?connector=email">使用邮箱验证码登录</a>
    </div>
    <p class="footnote" id="pageNote">登录后会返回你刚才要访问的页面。当前不支持 Apple、QQ 或微信登录。</p>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

  <script type="module">
    import { isStaticMockPreview, safeAuthRedirectPath } from "./assets/auth-session.js";
    const GOOGLE_ENTRY = "/api/auth/sign-in?connector=google";
    const EMAIL_ENTRY = "/api/auth/sign-in?connector=email";
    const statusEl = document.getElementById("status");
    const currentLang = (() => {
      const saved = (localStorage.getItem("flipgame_lang") || "").toLowerCase();
      if (saved === "zh" || saved === "en") return saved;
      return (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
    })();
    const I18N = {
      zh: {
        title: "登录 · ShinE", home: "回到主页", pageTitle: "登录",
        pageDesc: "使用 Google 或邮箱验证码登录。首次使用时，Logto 会在同一流程中完成账号创建。",
        google: "使用 Google 登录", email: "使用邮箱验证码登录",
        note: "登录后会返回你刚才要访问的页面。当前不支持 Apple、QQ 或微信登录。",
        static: "当前是静态预览，请在 Netlify local runtime 或已部署站点打开登录。"
      },
      en: {
        title: "Login · ShinE", home: "Home", pageTitle: "Login",
        pageDesc: "Use Google or an email verification code. Logto completes account creation in the same hosted flow for first-time users.",
        google: "Continue with Google", email: "Continue with email code",
        note: "You will return to the page you were visiting. Apple, QQ, and WeChat are not available yet.",
        static: "This is a static preview. Open login in the Netlify local runtime or a deployed site."
      }
    };
    function t(key) { return I18N[currentLang][key] || I18N.zh[key] || ""; }
    function safeNext() {
      const value = new URLSearchParams(window.location.search).get("next") || "/index.html";
      return safeAuthRedirectPath(value);
    }
    function buildEntry(base) {
      const url = new URL(base, window.location.origin);
      url.searchParams.set("next", safeNext());
      url.searchParams.set("locale", currentLang === "zh" ? "zh-CN" : "en-US");
      return `${url.pathname}${url.search}`;
    }
    function setStaticText() {
      document.documentElement.lang = currentLang === "zh" ? "zh-Hans" : "en";
      document.title = t("title");
      document.getElementById("homeLink").textContent = t("home");
      document.getElementById("pageTitle").textContent = t("pageTitle");
      document.getElementById("pageDesc").textContent = t("pageDesc");
      document.getElementById("googleLogin").textContent = t("google");
      document.getElementById("emailLogin").textContent = t("email");
      document.getElementById("pageNote").textContent = t("note");
    }
    setStaticText();
    for (const [id, entry] of [["googleLogin", GOOGLE_ENTRY], ["emailLogin", EMAIL_ENTRY]]) {
      document.getElementById(id).addEventListener("click", (event) => {
        if (isStaticMockPreview()) {
          event.preventDefault();
          statusEl.textContent = t("static");
          return;
        }
        event.currentTarget.href = buildEntry(entry);
      });
    }
  </script>
</body>
</html>
