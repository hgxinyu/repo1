<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>隐私政策 · ShineGame</title>
  <link rel="icon" type="image/svg+xml" href="assets/shine-logo.svg" />
  <style>
    :root { --ink:#17202a; --muted:#607080; --brand:#0f766e; --line:#dde7e3; --bg:#f5f9f7; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 "Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
    main { width:min(820px,calc(100% - 32px)); margin:32px auto; padding:clamp(24px,5vw,48px); background:#fff; border:1px solid var(--line); border-radius:18px; }
    nav { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-bottom:28px; }
    a,button { color:var(--brand); }
    button { border:1px solid var(--line); border-radius:999px; background:#fff; padding:7px 12px; cursor:pointer; }
    h1 { margin:0 0 4px; font-size:clamp(28px,5vw,40px); line-height:1.2; }
    h2 { margin:30px 0 8px; font-size:20px; }
    p,li { color:var(--muted); }
    ul { padding-left:22px; }
    .updated { margin:0 0 28px; font-size:14px; }
    footer { margin-top:36px; padding-top:20px; border-top:1px solid var(--line); font-size:14px; }
  </style>
</head>
<body>
  <main>
    <nav><a id="home" href="index.html">返回 ShineGame</a><button id="language" type="button">English</button></nav>
    <h1 id="title">隐私政策</h1>
    <p class="updated" id="updated">更新日期：2026 年 8 月 29 日</p>
    <section id="content"></section>
    <footer><a href="Terms.html" id="terms">服务条款</a> · <a href="mailto:huangxinyu@gmail.com">huangxinyu@gmail.com</a></footer>
  </main>
  <script>
    const I18N = {
      zh: {
        title:"隐私政策", updated:"更新日期：2026 年 8 月 29 日", home:"返回 ShineGame", language:"English", terms:"服务条款",
        html:`
          <h2>我们收集的信息</h2><p>当你使用 Google 或邮箱验证码登录时，我们接收已验证的邮箱地址、Logto 用户标识和必要的认证状态。你主动提交 VIP 申请时，我们还会保存公会名和游戏 ID。你通过公会招募提交申请时，所填写的账号概况、微信 ID、游戏 ID 和背包英雄截图会通过邮件发送给招募联系人。系统会保存账号角色、状态以及用于安全审计的会话和登录元数据。</p>
          <h2>我们如何使用信息</h2><ul><li>创建账号，并把相同已验证邮箱的旧 ShineGame 账号安全关联到新账号。</li><li>提供注册会员、VIP 和管理员权限。</li><li>维护 session、阻止重放或滥用，并排查登录问题。</li><li>回复账号删除、隐私或支持请求。</li></ul>
          <h2>认证与服务提供商</h2><p>ShineGame 使用 Logto 处理登录；选择 Google 登录时，Google 也会处理认证。网站托管及后端运行使用 Netlify，账号数据库使用 Neon。我们不会出售个人信息，也不会要求或保存你的 Google 密码。</p>
          <h2>Cookie 与安全</h2><p>我们使用第一方、HTTP-only session cookie，以及登录前状态和 CSRF cookie。敏感邮箱和刷新令牌在数据库中加密或散列保存；浏览器本地存储不保存登录令牌。</p>
          <h2>保留、访问与删除账号</h2><p>账号数据会在提供服务、安全审计和履行合理法律义务所需期间保留。你可发送邮件至 <a href="mailto:huangxinyu@gmail.com">huangxinyu@gmail.com</a> 请求访问、更正或删除账号。删除完成前，我们可能需要验证账号所有权。</p>
          <h2>变更与联系</h2><p>如果本政策有重要变化，我们会更新本页日期。对隐私或账号删除有疑问，请联系 <a href="mailto:huangxinyu@gmail.com">huangxinyu@gmail.com</a>。</p>`
      },
      en: {
        title:"Privacy Policy", updated:"Last updated: August 29, 2026", home:"Back to ShineGame", language:"中文", terms:"Terms of Service",
        html:`
          <h2>Information we collect</h2><p>When you sign in with Google or an email verification code, we receive your verified email address, a Logto user identifier, and authentication status required for the service. If you request VIP access, we also store the guild name and game ID you provide. If you apply through Guild Recruitment, the account summary, WeChat ID, game ID, and hero bag screenshot you choose to submit are sent to the recruitment contact by email. We keep account role, status, and limited session and sign-in metadata for security auditing.</p>
          <h2>How we use information</h2><ul><li>Create your account and securely link a legacy ShineGame account that has the same verified email.</li><li>Provide registered-member, VIP, and administrator access.</li><li>Maintain sessions, prevent replay or abuse, and troubleshoot authentication.</li><li>Respond to account deletion, privacy, and support requests.</li></ul>
          <h2>Authentication and service providers</h2><p>ShineGame uses Logto for authentication. Google also processes authentication when you choose Google sign-in. Netlify hosts and runs the site backend, and Neon stores account data. We do not sell personal information, and we never request or store your Google password.</p>
          <h2>Cookies and security</h2><p>We use first-party HTTP-only session cookies plus pre-authentication state and CSRF cookies. Sensitive email and refresh-token data is encrypted or hashed in the database. Login tokens are not stored in browser local storage.</p>
          <h2>Retention, access, and account deletion</h2><p>We retain account data while needed to provide the service, maintain security records, and meet reasonable legal obligations. Email <a href="mailto:huangxinyu@gmail.com">huangxinyu@gmail.com</a> to request access, correction, or account deletion. We may verify account ownership before completing a request.</p>
          <h2>Changes and contact</h2><p>We will update the date on this page when this policy materially changes. For privacy or account deletion questions, contact <a href="mailto:huangxinyu@gmail.com">huangxinyu@gmail.com</a>.</p>`
      }
    };
    let lang = localStorage.getItem("flipgame_lang") === "en" ? "en" : (localStorage.getItem("flipgame_lang") === "zh" ? "zh" : ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en"));
    function render() { const t=I18N[lang]; document.documentElement.lang=lang==="zh"?"zh-Hans":"en"; document.title=`${t.title} · ShineGame`; document.getElementById("title").textContent=t.title; document.getElementById("updated").textContent=t.updated; document.getElementById("home").textContent=t.home; document.getElementById("language").textContent=t.language; document.getElementById("terms").textContent=t.terms; document.getElementById("content").innerHTML=t.html; }
    document.getElementById("language").addEventListener("click",()=>{ lang=lang==="zh"?"en":"zh"; localStorage.setItem("flipgame_lang",lang); render(); });
    render();
  </script>
</body>
</html>
