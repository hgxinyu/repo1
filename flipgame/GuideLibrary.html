<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>攻略库 · ShineGame</title><link rel="stylesheet" href="assets/guide-library.css"></head><body>
<header><a class="brand" href="index.html">ShineGame · <span data-zh="攻略库" data-en="Guides">攻略库</span></a><a href="index.html" data-zh="返回主页" data-en="Home">返回主页</a></header>
<main class="shell"><div id="preview" class="notice" hidden></div><section id="catalog"><h1 data-zh="攻略库" data-en="Guide library">攻略库</h1><p class="muted" data-zh="活动路线、养成资料与国风原创攻略。原版图片，保留作者水印。" data-en="Event routes, progression resources and Guofeng guides. Original artwork and watermarks preserved."></p>
<nav class="row tabs" aria-label="Categories"><a class="button" href="GuideLibrary.html" data-zh="全部" data-en="All"></a><a class="button" href="?category=weekly" data-zh="周活动" data-en="Weekly"></a><a class="button" href="?category=public" data-zh="普通攻略" data-en="Public"></a><a class="button" href="?category=vip">VIP</a></nav>
<div id="status" role="status"></div><div id="guides" class="grid"></div><p style="margin-top:28px"><a id="legacy" href="GuideImages.html" data-zh="查看原有攻略图片 →" data-en="Browse the existing image archive →"></a></p></section>
<section id="reader" hidden><a href="GuideLibrary.html" data-zh="← 返回攻略库" data-en="← Back to library"></a><h1 id="readerTitle" style="margin-top:20px"></h1><p class="muted" data-zh="原版分页阅读 · 保留原图与水印" data-en="Original pages · Artwork and watermarks preserved"></p><p class="notice" id="edition"></p><div class="reader-tools"><button id="prev" data-zh="上一页" data-en="Previous"></button><label for="page" style="margin:0" data-zh="页码" data-en="Page"></label><input id="page" type="number" min="1" value="1"><span id="count"></span><button id="next" data-zh="下一页" data-en="Next"></button><button id="zoom" data-zh="放大 / 适应宽度" data-en="Zoom / Fit width"></button><button id="retry" data-zh="重新加载" data-en="Reload"></button></div><p id="pageStatus" role="status"></p><div class="page-frame" id="frame"><img id="pageImage" alt="" hidden></div></section></main>
<script type="module">
import {api,preview,t,titleOf,categoryName,pageBlob,translate,readingPages,languageNotice} from './assets/guide-client.js';
translate();document.title=t('攻略库 · ShineGame','Guide library · ShineGame');
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const category=params.get('category');
if(preview){$('preview').hidden=false;$('preview').textContent=t('本地预览 · 当前浏览器中的演示数据，未发布到线上。','Local preview · Demo data in this browser; not published online.');}
if(category==='weekly')$('legacy').href='GuideImages.html?guide=weekly-current';
document.querySelectorAll('.tabs a').forEach(a=>{if(new URL(a.href).searchParams.get('category')===category)a.setAttribute('aria-current','page');});
let guide,pages=[],current=0,objectURL,requestVersion=0;
async function showPage(index){
  current=Math.max(0,Math.min(pages.length-1,index));const version=++requestVersion;
  $('page').value=current+1;$('count').textContent=`/ ${pages.length}`;$('prev').disabled=current===0;$('next').disabled=current===pages.length-1;
  $('pageImage').hidden=true;$('pageImage').removeAttribute('src');if(objectURL)URL.revokeObjectURL(objectURL);
  $('pageStatus').textContent=t('正在加载原图…','Loading original page…');
  try{const blob=await pageBlob(guide,pages[current]);if(version!==requestVersion)return;objectURL=URL.createObjectURL(blob);$('pageImage').src=objectURL;$('pageImage').alt=`${titleOf(guide)} · ${current+1}`;await $('pageImage').decode();if(version!==requestVersion)return;$('pageImage').hidden=false;$('pageStatus').textContent='';}
  catch(error){if(version===requestVersion)$('pageStatus').textContent=error.message;}
}
$('prev').onclick=()=>showPage(current-1);$('next').onclick=()=>showPage(current+1);$('retry').onclick=()=>showPage(current);$('page').onchange=()=>showPage((Number($('page').value)||1)-1);$('zoom').onclick=()=>$('frame').classList.toggle('zoom');
try{
 if(params.has('id')){({guide}=await api(`?id=${encodeURIComponent(params.get('id'))}`));pages=guide?readingPages(guide):[];if(!guide||!pages.length)throw new Error(t('攻略尚未发布。','This guide is not published.'));$('catalog').hidden=true;$('reader').hidden=false;$('readerTitle').textContent=titleOf(guide);$('edition').textContent=languageNotice(guide);$('page').max=pages.length;await showPage(0);}
 else{const {guides}=await api();const filtered=guides.filter(g=>!category||g.category===category);if(!filtered.length)$('status').textContent=t('此分类暂未发布新攻略，可先浏览原有攻略图片。','No new guides in this category yet. Browse the existing archive below.');for(const g of filtered){const card=document.createElement('article');card.className='card';const badge=document.createElement('span');badge.className='badge';badge.textContent=categoryName(g.category);const heading=document.createElement('h2');heading.textContent=titleOf(g);const info=document.createElement('p');info.className='muted';info.textContent=`${g.pageCount} ${t('页中文','Chinese pages')} · ${g.pageCountEn || 0} ${t('页英文','English pages')} · ${g.updatedAt.slice(0,10)}`;const a=document.createElement('a');a.className='button';a.href=`?id=${encodeURIComponent(g.id)}`;a.textContent=g.category==='vip'?t('VIP 阅读 →','Read with VIP →'):t('开始阅读 →','Read guide →');card.append(badge,heading,info,a);$('guides').append(card);}}
}catch(error){$('status').textContent=error.message;$('status').className='notice error';const a=document.createElement('a');const needsLogin=error.status===401||error.status===403;a.href=needsLogin?'Login.html?next=%2FGuideLibrary.html':location.href;a.textContent=needsLogin?t('登录 / 查看账号权限','Sign in / check account'):t('重新加载','Retry');$('status').append(document.createElement('br'),a);}
</script></body></html>
