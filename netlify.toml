[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/auth/sign-in"
  to = "/.netlify/functions/auth-sign-in"
  status = 200

[[redirects]]
  from = "/api/auth/callback"
  to = "/.netlify/functions/auth-callback"
  status = 200

[[redirects]]
  from = "/api/auth/session"
  to = "/.netlify/functions/auth-session"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/auth/legacy-bridge"
  to = "/.netlify/functions/auth-legacy-bridge"
  status = 200

[[redirects]]
  from = "/api/vip-request"
  to = "/.netlify/functions/vip-request"
  status = 200

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/api/ai-chat"
  to = "/.netlify/functions/ai-chat"
  status = 200

[[redirects]]
  from = "/api/discord-feed"
  to = "/.netlify/functions/discord-feed"
  status = 200

[[redirects]]
  from = "/api/quality-prices"
  to = "/.netlify/functions/quality-prices"
  status = 200

[[redirects]]
  from = "/api/admin/users"
  to = "/.netlify/functions/admin-users"
  status = 200

[[redirects]]
  from = "/api/admin/set-role"
  to = "/.netlify/functions/admin-set-role"
  status = 200

[[redirects]]
  from = "/api/admin/quality-prices"
  to = "/.netlify/functions/admin-quality-prices"
  status = 200
